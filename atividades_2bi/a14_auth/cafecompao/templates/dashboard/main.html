{% load static %}

<c-layouts.base title="Dashboard">
  <main class="max-w-5xl mx-auto my-12 px-4">
    <div class="flex flex-col gap-2 mb-8">
      <h1 class="text-4xl font-bold">Bem-vindo a sua conta</h1>
      <p class="text-lg">Gerencie suas informacoes pessoais e seu acesso.</p>
    </div>

    <section class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div>
            <h2 class="text-2xl font-semibold">Informacoes do usuario</h2>
            <p class="mt-2"><strong>Nome:</strong> {{ user.first_name }} {{ user.last_name }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
          </div>
          <div class="flex gap-2">
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline">Sair</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
</c-layouts.base>
