{% load static %}

<c-layouts.base>
<!-- INICIO DO HERO -->
<div class="hero min-h-[70vh]" style="background-image: url({% static 'images/padaria1.png' %});">
  <div class="hero-overlay"></div>
  <div class="hero-content text-neutral-content text-center">
    <div class="max-w-2xl">
      <h1 class="mb-5 text-5xl font-bold">Nossas Padarias</h1>
      <p class="mb-5 text-xl">
        Encontre a padaria mais perto de você
      </p>
    </div>
  </div>
</div>
<!-- FIM DO HERO -->

<!-- INICIO DO MAIN -->
<main class="max-w-6xl mx-auto my-20 p-2">
  <h1 class="text-4xl mb-10">Conheça nossas unidades</h1>
  
  <!-- LISTA DE PADARIAS -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {% for padaria in padarias %}
    <div class="card bg-base-100 shadow-xl hover:shadow-2xl transition">
      <figure>
        <img src="{% static 'images/' %}{{ padaria.imagem }}" alt="{{ padaria.nome }}" class="w-full h-48 object-cover" />
      </figure>
      <div class="card-body">
        <h2 class="card-title text-xl">{{ padaria.nome }}</h2>
        
        <div class="space-y-2 text-sm">
          <div class="flex items-start gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span>{{ padaria.endereco }}</span>
          </div>
          
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 00.948-.684l1.498-4.493a1 1 0 011.502-.684l1.498 4.493a1 1 0 00.948.684H17a2 2 0 012 2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V5z" />
            </svg>
            <a href="tel:{{ padaria.telefone }}" class="link link-primary">{{ padaria.telefone }}</a>
          </div>
          
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ padaria.horario }}</span>
          </div>
        </div>
        
        <div class="card-actions justify-end mt-4">
          <a href="{% url 'contato' %}" class="btn btn-primary btn-sm">Entre em contato</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
  <!-- FIM LISTA DE PADARIAS -->
</main>
<!-- FIM DO MAIN -->
</c-layouts.base>
